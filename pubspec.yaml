name: openvision
description: "OpenVision — мобильное приложение: камеры и события компании."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  cached_network_image: ^3.4.1
  device_info_plus: ^13.3.0
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  go_router: ^17.5.0
  intl: ^0.20.2
  path_drawing: ^1.0.1
  provider: ^6.1.5+1
  share_plus: ^13.3.1
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  # Шрифты подключены файлами, без загрузки в рантайме (design-system/README.md).
  # Статические начертания нарезаны из вариативных Google Fonts (OFL, лицензии рядом).
  fonts:
    - family: Golos Text
      fonts:
        - asset: assets/fonts/GolosText-Regular.ttf
          weight: 400
        - asset: assets/fonts/GolosText-Medium.ttf
          weight: 500
        - asset: assets/fonts/GolosText-SemiBold.ttf
          weight: 600
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
