<!-- @dsCard group="Экраны" height=1760 width=1600 page subtitle="Ключевые экраны MVP, собранные из компонентов" -->
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Экраны OpenVision</title>
<style>
  body { background: var(--surface-sunken); }
  .board { display: grid; grid-template-columns: repeat(4, 360px); gap: 40px 32px; padding: 32px; width: 1600px; }
  .cap { font-size: 13px; line-height: 18px; color: var(--ink-muted); margin: 0 0 10px 4px; }
  .cap b { color: var(--ink); font-weight: 600; margin-right: 6px; }
  .ph { width: 360px; height: 760px; border-radius: 28px; border: 1px solid var(--line); background: var(--bg); overflow: hidden; display: flex; flex-direction: column; position: relative; }
  .sb { height: 28px; flex: none; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; font-size: 12px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
  .sb i { display: inline-block; width: 18px; height: 9px; border: 1.5px solid currentColor; border-radius: 2px; opacity: .8; }
  .scroll { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
  .pad { padding: 0 16px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 16px; }
  .gap { display: flex; flex-direction: column; gap: 12px; }
  .fab { position: absolute; right: 16px; bottom: 80px; height: 56px; padding: 0 20px 0 16px; border-radius: 16px; background: var(--brand); color: var(--on-brand); display: flex; align-items: center; gap: 8px; font-weight: 600; box-shadow: var(--shadow-sheet); }
  .day { padding: 16px 16px 8px; font-size: 13px; font-weight: 600; color: var(--ink-muted); }
  .kv { display: flex; justify-content: space-between; padding: 12px 16px; font-size: 15px; }
  .kv span:first-child { color: var(--ink-muted); }
  .brandmark { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 20px; letter-spacing: -.01em; }
  .muted { color: var(--ink-muted); font-size: 14px; line-height: 20px; }
  .h1 { font-size: 28px; line-height: 34px; font-weight: 600; letter-spacing: -.01em; margin: 0; }
  .q { font-size: 20px; line-height: 26px; font-weight: 600; margin: 0; }
  .steps { display: flex; gap: 6px; padding: 4px 16px 0; }
  .steps span { flex: 1; height: 4px; border-radius: 9999px; background: var(--line); }
  .steps span.on { background: var(--brand); }
  .bottom { margin-top: auto; padding: 16px; border-top: 1px solid var(--line); background: var(--surface); }
  .note { display: flex; gap: 8px; font-size: 13px; line-height: 18px; color: var(--ink); background: var(--warn-soft); padding: 10px 12px; border-radius: 8px; }
  .note svg { color: var(--warn); }
</style>
</head>
<body>
<div id="root"></div>
<script>
var O = window.OpenVision, h = React.createElement, F = React.Fragment;
function Phone(cap, sub, kids) {
  return h('div', null, h('p', { className: 'cap' }, h('b', null, cap), sub),
    h('div', { className: 'ph' }, h('div', { className: 'sb' }, h('span', null, '9:41'), h('i')), kids));
}
var login = Phone('1 · Вход', 'POST /auth/login', h('div', { className: 'scroll', style: { padding: '48px 20px 20px', gap: 24 } },
  h('div', { className: 'brandmark' }, 'OpenVision'),
  h('div', null, h('h1', { className: 'h1' }, 'Вход'), h('p', { className: 'muted', style: { margin: '6px 0 0' } }, 'Камеры и события вашей компании')),
  h('div', { className: 'gap', style: { gap: 16 } },
    h(O.TextField, { label: 'Эл. почта', type: 'email', defaultValue: 'aida@acme.kz' }),
    h(O.TextField, { label: 'Пароль', type: 'password', defaultValue: 'demo-password', error: 'Неверная почта или пароль' })),
  h(O.Button, { block: true }, 'Войти'),
  h('div', { style: { marginTop: 'auto', textAlign: 'center' } }, h('span', { className: 'muted' }, 'Нет аккаунта? '), h('span', { style: { color: 'var(--brand)', fontWeight: 600, fontSize: 14 } }, 'Зарегистрировать компанию'))));

var dash = Phone('2 · Обзор', 'GET /stats/summary', h(F, null, h('div', { className: 'scroll' },
  h(O.AppBar, { title: 'Обзор', large: true, actions: [{ icon: 'bell', label: 'Уведомления' }] }),
  h('p', { className: 'muted pad', style: { margin: '-6px 0 12px' } }, 'Сегодня, 29 октября · Acme LLP'),
  h('div', { className: 'grid2' },
    h(O.StatTile, { label: 'События', value: 312 }),
    h(O.StatTile, { label: 'Камеры в сети', value: 2, total: 3, sub: '1 не в сети', subTone: 'danger' }),
    h(O.StatTile, { label: 'Уникальных людей', value: 118 }),
    h(O.StatTile, { label: 'Известные', value: 40, sub: '13% событий' })),
  h('div', { className: 'pad', style: { marginTop: 12 } }, h(O.HourlyChart, { nowHour: 15, data: [0,0,0,0,0,1,3,9,22,41,35,28,31,26,30,18] })),
  h('div', { className: 'ov-section' }, 'Требуют внимания'),
  h('div', { className: 'pad' }, h(O.CameraCard, { name: 'Склад', location: 'Погрузка', status: 'offline', reason: 'no_video', lastSeen: '3 ч назад', thumb: null }))),
  h(O.TabBar, { active: 'dashboard', badges: { cameras: 1 } })));

var cams = Phone('3 · Камеры', 'GET /cameras + live camera_status', h(F, null, h('div', { className: 'scroll' },
  h(O.AppBar, { title: 'Камеры', large: true, actions: [{ icon: 'plus', label: 'Добавить камеру' }] }),
  h('p', { className: 'muted pad', style: { margin: '-6px 0 12px' } }, '3 из 4 по тарифу'),
  h('div', { className: 'pad gap' },
    h(O.CameraCard, { name: 'Вход — главный', location: 'Главная дверь', status: 'online', lastEventAt: '2 мин назад', canControl: true }),
    h(O.CameraCard, { name: 'Касса', location: 'Зал', status: 'online', lastEventAt: '14 мин назад', canControl: true }),
    h(O.CameraCard, { name: 'Склад', location: 'Погрузка', status: 'offline', reason: 'no_video', lastSeen: '3 ч назад', thumb: null, canControl: true }))),
  h('div', { className: 'fab' }, h(O.Icon, { name: 'plus', size: 22 }), 'Камера'),
  h(O.TabBar, { active: 'cameras', badges: { cameras: 1 } })));

var feed = Phone('4 · События', 'GET /events?cursor… + live event', h(F, null, h('div', { className: 'scroll' },
  h(O.AppBar, { title: 'События', large: true, actions: [{ icon: 'filter', label: 'Фильтры' }] }),
  h(O.ConnectionBanner, { state: 'live' }),
  h('div', { className: 'ov-chips' }, h(O.FilterChip, { selected: true }, 'Сегодня'), h(O.FilterChip, { menu: true, icon: 'camera' }, 'Все камеры'), h(O.FilterChip, null, 'Неизвестные')),
  h('div', { className: 'day' }, 'Сегодня'),
  h('div', { className: 'ov-list' },
    h(O.EventRow, { known: false, cameraName: 'Вход — главный', time: '15:42', isNew: true, seenToday: 4 }),
    h(O.EventRow, { known: true, confidence: 0.87, cameraName: 'Касса', time: '15:38' }),
    h(O.EventRow, { known: false, cameraName: 'Вход — главный', time: '15:31' }),
    h(O.EventRow, { known: false, cameraName: 'Касса', time: '15:20', seenToday: 2 }),
    h(O.EventRow, { known: true, confidence: 0.92, cameraName: 'Вход — главный', time: '15:02' }),
    h(O.EventRow, { known: false, cameraName: 'Вход — главный', time: '14:57' }))),
  h(O.TabBar, { active: 'events', badges: { cameras: 1 } })));

var detail = Phone('5 · Событие', 'GET /events/{id}', h('div', { className: 'scroll' },
  h(O.AppBar, { title: 'Неизвестный', back: true }),
  h('div', { className: 'pad' }, h(O.FrameViewer, { bbox: [626, 238, 124, 150], label: 'Неизвестный', time: '29.10 15:42:08' })),
  h('div', { style: { display: 'flex', gap: 12, alignItems: 'center', padding: '16px' } },
    h(O.MediaPlaceholder, { kind: 'face', style: { width: 72, height: 72, borderRadius: 4 } }),
    h('div', null, h('div', { style: { fontWeight: 600, fontSize: 16 } }, 'Неизвестный человек'), h('div', { className: 'muted' }, 'Сегодня 4 раза · первый раз в 09:12'))),
  h('div', { className: 'ov-list' },
    h('div', { className: 'kv' }, h('span', null, 'Камера'), h('span', null, 'Вход — главный')),
    h('div', { className: 'kv' }, h('span', null, 'Время'), h('span', { className: 'ov-num' }, '29 октября, 15:42:08')),
    h('div', { className: 'kv' }, h('span', null, 'Тип'), h('span', null, 'Лицо'))),
  h('div', { style: { padding: 16 } }, h(O.Button, { variant: 'secondary', block: true, icon: 'face' }, 'Все появления этого человека'))));

var mode = Phone('6 · Добавить камеру', 'шаг 1 — выбор mode', h('div', { className: 'scroll' },
  h(O.AppBar, { title: 'Новая камера', back: true }),
  h('div', { className: 'steps' }, h('span', { className: 'on' }), h('span'), h('span')),
  h('div', { style: { padding: '20px 16px 16px' } }, h('h2', { className: 'q' }, 'Как камера подключена к интернету?'), h('p', { className: 'muted', style: { margin: '6px 0 0' } }, 'От ответа зависит способ подключения. Если не уверены — выберите первый вариант.')),
  h('div', { className: 'pad gap', role: 'radiogroup' },
    h(O.ModeOption, { icon: 'box', title: 'Камеры только в нашей сети', description: 'Поставим блок OpenVision, он передаст видео.', tag: 'Чаще всего', selected: true }),
    h(O.ModeOption, { icon: 'send', title: 'Регистратор отправляет поток', description: 'Hikvision, Dahua, Milestone — дадим адрес.' }),
    h(O.ModeOption, { icon: 'link', title: 'У камеры есть адрес в интернете', description: 'Публичный IP или облачный регистратор.' })),
  h('div', { className: 'bottom' }, h(O.Button, { block: true }, 'Далее'))));

var push = Phone('7 · Push: адрес выдан', 'POST /cameras {mode: push}', h('div', { className: 'scroll' },
  h(O.AppBar, { title: 'Касса', back: true }),
  h('div', { className: 'steps' }, h('span', { className: 'on' }), h('span', { className: 'on' }), h('span', { className: 'on' })),
  h('div', { style: { padding: '16px', display: 'flex', flexDirection: 'column', gap: 14 } },
    h('p', { className: 'muted', style: { margin: 0 } }, 'Вставьте адрес в настройки регистратора. Камера станет зелёной, как только пойдёт видео.'),
    h(O.CopyField, { label: 'SRT', badge: 'Рекомендуем', value: 'srt://ingest.openvision.kz:8890?streamid=publish:cam/18:push:ovk_7Hq2…&pkt_size=1316' }),
    h(O.CopyField, { label: 'RTSP — если SRT не поддерживается', value: 'rtsp://push:ovk_7Hq2…@ingest.openvision.kz:8554/cam/18' }),
    h('div', { className: 'note' }, h(O.Icon, { name: 'alert', size: 18 }), 'Ключ показываем только один раз. Сохраните или отправьте его сейчас.'),
    h(O.StatusReason, { reason: 'waiting_for_video' })),
  h('div', { className: 'bottom', style: { display: 'flex', gap: 12 } }, h(O.Button, { variant: 'secondary', icon: 'share' }, 'Отправить'), h(O.Button, { style: { flex: 1 } }, 'Готово'))));

var team = Phone('8 · Команда', 'GET /users · только admin/owner', h(F, null, h('div', { className: 'scroll' },
  h(O.AppBar, { title: 'Команда', large: true, actions: [{ icon: 'plus', label: 'Пригласить' }] }),
  h('p', { className: 'muted pad', style: { margin: '-6px 0 12px' } }, '4 участника'),
  h('div', { className: 'ov-list' },
    h(O.MemberRow, { name: 'Аида Серикова', email: 'aida@acme.kz', role: 'owner', isYou: true }),
    h(O.MemberRow, { name: 'Ерлан Нурланов', email: 'erlan@acme.kz', role: 'admin', editable: true }),
    h(O.MemberRow, { name: 'Тимур Ахметов', email: 'timur@acme.kz', role: 'operator', editable: true }),
    h(O.MemberRow, { name: 'Дана Касымова', email: 'dana@acme.kz', role: 'viewer', active: false, editable: true })),
  h('div', { className: 'ov-section' }, 'Аккаунт'),
  h('div', { className: 'ov-list' },
    h('div', { className: 'kv' }, h('span', null, 'Тариф'), h('span', null, 'Face · 4 камеры')),
    h('div', { className: 'kv' }, h('span', null, 'Хранение событий'), h('span', null, '30 дней')),
    h('div', { className: 'kv' }, h('span', { style: { color: 'var(--brand)' } }, 'Сменить пароль'), h('span')),
    h('div', { className: 'kv' }, h('span', { style: { color: 'var(--danger)' } }, 'Выйти'), h('span')))),
  h(O.TabBar, { active: 'team', badges: { cameras: 1 } })));

ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'board' }, login, dash, cams, feed, detail, mode, push, team));
</script>
</body>
</html>
