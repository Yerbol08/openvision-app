<!-- @dsCard group="Камеры" height=420 -->
<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>CameraCard</title></head>
<body>
<div id="root" class="ov-stack"></div>
<script>
  var O = window.OpenVision, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h(O.CameraCard,{name:'Вход — главный',location:'Главная дверь',status:'online',lastEventAt:'2 мин назад',canControl:true}),
h(O.CameraCard,{name:'Склад',location:'Погрузка',status:'offline',reason:'no_video',lastSeen:'3 ч назад',thumb:null}),
h(O.CameraCard,{name:'Касса',status:'connecting',reason:'waiting_for_video',thumb:null})
  ));
</script>
</body>
</html>
