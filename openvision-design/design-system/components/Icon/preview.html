<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>Icon</title></head>
<body>
<div id="root" class="ov-stack"></div>
<script>
  var O = window.OpenVision, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h('div',{style:{display:'flex',flexWrap:'wrap',gap:16,color:'var(--ink)'}},O.Icon.names.map(function(n){return h('div',{key:n,title:n,style:{width:64,display:'flex',flexDirection:'column',alignItems:'center',gap:6,fontSize:11,color:'var(--ink-muted)'}},h('span',{style:{color:'var(--ink)'}},h(O.Icon,{name:n,size:24})),n);}))
  ));
</script>
</body>
</html>
