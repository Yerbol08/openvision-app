<!-- @dsCard group="Статусы" height=96 -->
<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>StatusBadge</title></head>
<body>
<div id="root" class="ov-stack"></div>
<script>
  var O = window.OpenVision, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h('div',{className:'ov-row',style:{padding:0}},['online','connecting','pending','offline','error','disabled'].map(function(s){return h(O.StatusBadge,{key:s,status:s});}))
  ));
</script>
</body>
</html>
